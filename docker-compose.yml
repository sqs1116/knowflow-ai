services:
  nacos:
    image: nacos/nacos-server:v2.2.0
    container_name: knowflow-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: knowflow-sentinel
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Dserver.port=8858
        -Dcsp.sentinel.dashboard.server=localhost:8858
        -Dproject.name=sentinel-dashboard
    ports:
      - "127.0.0.1:8858:8858"

volumes:
  nacos-data:
    name: knowflow-nacos-data
  nacos-logs:
    name: knowflow-nacos-logs
